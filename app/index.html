<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#6d5efc" />
    <meta name="description" content="ذاكرلي: مساعدك الذكي للمذاكرة — لخّص، اسأل، واختبر نفسك من أي كتاب أو صورة." />
    <link rel="icon" href="../icon.svg" type="image/svg+xml" />
    <!-- ?v= forces iPhones to fetch the icon again instead of reusing an old failed attempt -->
    <link rel="apple-touch-icon" sizes="180x180" href="../apple-touch-icon.png?v=3" />
    <link rel="apple-touch-icon-precomposed" sizes="180x180" href="../apple-touch-icon.png?v=3" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="ذاكرلي" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <title>ذاكرلي — Zakerly</title>
    <script>
      try {
        var s = JSON.parse(localStorage.getItem("zakerly.settings") || "{}");
        var t = s.theme || "system";
        var dark = t === "dark" || (t === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.dataset.theme = dark ? "dark" : "light";
        var l = s.lang || "ar";
        document.documentElement.lang = l;
        document.documentElement.dir = l === "ar" ? "rtl" : "ltr";
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
